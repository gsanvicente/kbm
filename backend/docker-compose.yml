# Local development only. The app itself (cmd/api, cmd/worker) runs natively
# on the host (`make run`) — only Postgres is containerized here. Mounting
# migrations/ and scripts/init-db/ as individual files (not whole
# directories) lets us control execution order via the mapped filename,
# since Postgres runs /docker-entrypoint-initdb.d/* alphabetically.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kbm-postgres
    environment:
      POSTGRES_USER: kbm
      POSTGRES_PASSWORD: kbm
      POSTGRES_DB: kbm
    ports:
      - "5432:5432"
    volumes:
      - kbm_postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./migrations/0002_card_pan_hash_and_blocked_reason.sql:/docker-entrypoint-initdb.d/0002_migration.sql:ro
      - ./migrations/0003_client_kyb.sql:/docker-entrypoint-initdb.d/0003_migration.sql:ro
      - ./migrations/0004_approval_rules_unique_constraint.sql:/docker-entrypoint-initdb.d/0004_migration.sql:ro
      - ./migrations/0005_row_level_security_policies.sql:/docker-entrypoint-initdb.d/0005_migration.sql:ro
      - ./migrations/0006_staff_user_management.sql:/docker-entrypoint-initdb.d/0006_migration.sql:ro
      - ./scripts/init-db/001_seed.sql:/docker-entrypoint-initdb.d/0007_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbm -d kbm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kbm_postgres_data:
