name: kbm_cardholder
description: KBM self-service portal/app for tarjetahabientes (web + mobile).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kbm_logo.png
    - assets/images/card_black_template.png
